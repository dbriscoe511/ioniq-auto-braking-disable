; Parking Safety auto-disable firmware: ESP32-C3 SuperMini, ESP-IDF.
;
; Secrets: tools/make_secrets.py   (writes gitignored src/secrets.h)
; Build:   pio run
; Flash:   pio run -t upload        (local USB)  or  tools/flash_pi.sh  (via the Pi)
; Tests:   host_test/run.sh         (no hardware needed)

[env:supermini]
platform = espressif32@6.9.0
framework = espidf
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
