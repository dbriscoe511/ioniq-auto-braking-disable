; Parking Safety auto-disable firmware: ESP32-C3 SuperMini, ESP-IDF.
;
; Build:   PS_AP_PASS='your-wifi-password' pio run
; Flash:   PS_AP_PASS='...' pio run -t upload      (USB)
; OTA:     see README.md
; Tests:   host_test/run.sh                          (no hardware needed)

[env:supermini]
platform = espressif32@6.9.0
framework = espidf
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Wi-Fi AP password comes from the environment so it never lands in git.
build_flags =
    '-DPS_AP_PASS="${sysenv.PS_AP_PASS}"'
